[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm-daily-drive"
version = "0.1.0"
description = "Build a Daily Drive-style YouTube Music playlist on a schedule."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10,<4.0",
  "PyYAML>=6.0,<7.0",
  "ytmusicapi>=1.11,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
ytm-daily-drive = "ytm_daily_drive.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
